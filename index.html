<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovery Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body id="body">
    <main class="card" aria-label="Countdown timer card">
      <div class="content">
        <div class="top">
          <div class="title">
            <h1>Countdown Timer</h1>
            <p>Set time, then start.</p>
          </div>

          <div class="pill" title="Dark mode minimalist UI">
            <span class="dot" aria-hidden="true"></span>
            <span>Ready</span>
          </div>
        </div>

        <section class="main">
          <!-- Controls -->
          <div class="panel" id="men">
            <div class="panel-title">Set timer</div>

            <div class="inputs">
              <label class="field">
                <span class="label">Hours</span>
                <input
                  id="hours"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  step="1"
                  value="0"
                />
              </label>

              <label class="field">
                <span class="label">Minutes</span>
                <input
                  id="minutes"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  step="1"
                  value="0"
                />
              </label>

              <label class="field">
                <span class="label">Seconds</span>
                <input
                  id="seconds"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  step="1"
                  value="0"
                />
              </label>
            </div>

            <div class="buttons">
              <button
                id="startBtn"
                class="btn btn-primary"
                type="button"
              >
                Start
              </button>
              <button id="resetBtn" class="btn btn-ghost" type="button">
                Reset
              </button>
            </div>
          </div>

          <!-- Timer display -->
          <div class="timerWrap">
            <div class="timerCard">
              <div class="timerTop">
                <div class="timerLabel">Time remaining</div>
                <div id="stateBadge" class="badge badge-idle">Idle</div>
              </div>

              <div class="time" aria-live="polite">
                <span id="hh">00</span>
                <span class="sep" aria-hidden="true">:</span>
                <span id="mm">00</span>
                <span class="sep" aria-hidden="true">:</span>
                <span id="ss">00</span>
              </div>

              <div class="fineprint">
                <span class="spark"></span>
                <span id="hint2">Timer will count down to zero.</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    
    <script type="text/javascript" src="index.js" async></script>
  </body>
</html>
